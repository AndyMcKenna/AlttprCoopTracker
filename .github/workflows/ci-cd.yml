name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION: source/AlttpTracker.slnx
  API_PROJECT: source/AlttpTracker.Api/AlttpTracker.Api.csproj

# Nothing here needs to write to the repository. The deploy job adds the one
# extra permission it needs, an OIDC token, for itself alone.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    # A Postgres for the browser tests to point the app at. The integration
    # tests bring their own through Testcontainers; this one is for a real
    # running app, on the port playwright.config.js defaults to.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json

      # The sprite sheet build reads PNGs with pngjs, a devDependency of the
      # tooling under source/; the game tables and the export need nothing.
      - name: Install the tooling
        working-directory: source
        run: npm ci

      # The game is authored in source/data and carried to the API as
      # gamedata.json. Regenerating it here catches a checks.js edit that was
      # never exported — the app would otherwise seed yesterday's board.
      - name: Check the exported game data is current
        working-directory: source
        run: |
          npm run export-gamedata
          if ! git diff --quiet -- AlttpTracker.Api/gamedata.json; then
            echo "::error::gamedata.json is out of date. Run 'npm run export-gamedata' in source/ and commit the result."
            git diff -- AlttpTracker.Api/gamedata.json
            exit 1
          fi

      # The board draws its sprites from one packed sheet built out of the PNGs
      # in wwwroot/sprites. Rebuilding it here catches a sprite that was added
      # or redrawn without the sheet being regenerated. Only the CSS is
      # compared: it carries a fingerprint of the source pixels, and the PNG's
      # bytes can differ between zlib versions without the picture changing.
      - name: Check the sprite sheet is current
        working-directory: source
        run: |
          npm run build-sprites
          if ! git diff --quiet -- AlttpTracker.Api/wwwroot/sprites/sheet.css; then
            echo "::error::The sprite sheet is out of date. Run 'npm run build-sprites' in source/ and commit sheet.png and sheet.css."
            git diff -- AlttpTracker.Api/wwwroot/sprites/sheet.css
            exit 1
          fi

      - name: Test the game tables
        working-directory: source
        run: npm test

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      # Rules and data shape; fast, no container.
      - name: Test the rules
        run: >-
          dotnet test source/AlttpTracker.Api.Tests
          --configuration Release --no-build --logger "console;verbosity=normal"

      # Migrations, the unique index and the seeding, against a real Postgres.
      # Testcontainers uses the Docker daemon that ubuntu-latest already has.
      - name: Test against Postgres
        run: >-
          dotnet test source/AlttpTracker.Api.IntegrationTests
          --configuration Release --no-build --logger "console;verbosity=normal"

      # The board in a real browser, against the app built above on the
      # Postgres service. Playwright starts and stops the app itself.
      - name: Install the browser
        working-directory: source
        run: npx playwright install --with-deps chromium

      - name: Test the board in a browser
        working-directory: source
        run: npm run test:e2e
        env:
          CI: true
          E2E_SERVER_COMMAND: dotnet run --project AlttpTracker.Api --no-launch-profile --configuration Release --no-build

      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: source/playwright-report
          retention-days: 7

      - name: Publish
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: dotnet publish ${{ env.API_PROJECT }} --configuration Release --no-build --output ./publish

      - name: Upload the published app
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./publish

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only a merge to main ships. Pull requests stop at the tests above.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # The OIDC login to Azure needs a token minted for this job.
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: ./publish

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: ${{ vars.AZURE_WEBAPP_SLOT || 'production' }}
          package: ./publish
