name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  API_PROJECT: backend/AlttpTracker.Api/AlttpTracker.Api.csproj

# Deployment needs a token for the OIDC login to Azure.
permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The game is authored in the JS modules and carried to the API as
      # gamedata.json. Regenerating it here catches a checks.js edit that was
      # never exported — the app would otherwise seed yesterday's board.
      - name: Check the exported game data is current
        run: |
          npm run export-gamedata
          if ! git diff --quiet -- backend/AlttpTracker.Api/gamedata.json; then
            echo "::error::gamedata.json is out of date. Run 'npm run export-gamedata' and commit the result."
            git diff -- backend/AlttpTracker.Api/gamedata.json
            exit 1
          fi

      - name: Test the game tables
        run: npm test

      - name: Restore
        run: dotnet restore backend/AlttpTracker.slnx

      - name: Build
        run: dotnet build backend/AlttpTracker.slnx --configuration Release --no-restore

      # Rules and data shape; fast, no container.
      - name: Test the rules
        run: >-
          dotnet test backend/AlttpTracker.Api.Tests
          --configuration Release --no-build --logger "console;verbosity=normal"

      # Migrations, the unique index and the seeding, against a real Postgres.
      # Testcontainers uses the Docker daemon that ubuntu-latest already has.
      - name: Test against Postgres
        run: >-
          dotnet test backend/AlttpTracker.Api.IntegrationTests
          --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Publish
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: dotnet publish ${{ env.API_PROJECT }} --configuration Release --no-build --output ./publish

      - name: Upload the published app
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./publish

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only a merge to main ships. Pull requests stop at the tests above.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: ./publish

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: ${{ vars.AZURE_WEBAPP_SLOT || 'production' }}
          package: ./publish
